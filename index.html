<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>JARVIS AI — Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan: #00ffff;
      --cyan-dim: #0088aa;
      --red: #ff0033;
      --red-dim: #aa0022;
      --copper-light: #e09f67;
      --copper-dark: #8c4c23;
      --metal-light: #444;
      --metal-dark: #111;
      --metal-edge: #666;
      --bg-deep: #020202;
      --bg-glass: rgba(5, 5, 10, 0.75);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { 
      background: var(--bg-deep); 
      color: #fff; 
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    /* ===== 3D ENVIRONMENT SCENE ===== */
    .scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      perspective: 1200px; /* Strong depth perspective */
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: radial-gradient(circle at center, #0a1122 0%, #000 70%); /* Ambient blue dark haze */
    }

    /* Volumetric smoke/haze overlay */
    .atmosphere {
      position: absolute;
      inset: -50%;
      background-image: 
        radial-gradient(ellipse at center, rgba(0,255,255,0.05) 0%, transparent 40%),
        repeating-linear-gradient(45deg, rgba(255,0,52,0.02) 0px, transparent 10px, transparent 20px, rgba(0,255,255,0.02) 30px);
      filter: blur(10px);
      animation: haze-drift 30s linear infinite;
      pointer-events: none;
      z-index: 0; /* Behind reactor */
    }
    .atmosphere.front {
      z-index: 2; /* In front of reactor */
      background-image: radial-gradient(ellipse at center, rgba(0,255,255,0.08) 0%, transparent 50%);
      opacity: 0.6;
    }

    /* Floor plane and cables */
    .floor {
      position: absolute;
      width: 200vw;
      height: 200vw;
      background: 
        radial-gradient(circle at center, transparent 300px, #000 800px),
        repeating-linear-gradient(0deg, #111 0px, #111 2px, #050505 3px, #050505 40px),
        repeating-linear-gradient(90deg, #111 0px, #111 2px, #050505 3px, #050505 40px);
      transform-style: preserve-3d;
      transform: rotateX(75deg) translateZ(-400px);
      box-shadow: inset 0 0 200px #000;
    }

    /* The actual 3D Reactor Assembly */
    .reactor-assembly {
      position: relative;
      width: 600px;
      height: 600px;
      transform-style: preserve-3d;
      /* Tilt down and rotate to show depth like reference image */
      transform: rotateX(30deg) rotateY(15deg) rotateZ(0deg); 
      animation: gentle-hover 10s ease-in-out infinite;
      z-index: 1;
    }

    /* --- LAYERS (Back to Front) --- */

    /* Layer 1 (Deepest): Red Core Tunnel */
    .layer-deep-core {
      position: absolute;
      inset: 150px;
      transform: translateZ(-150px);
      background: radial-gradient(circle, var(--red) 0%, var(--red-dim) 50%, #000 80%);
      clip-path: polygon(50% 100%, 0 0, 100% 0); /* Inverted triangle */
      box-shadow: 0 0 100px var(--red), inset 0 0 50px #000;
      animation: pulse-core 2s alternate infinite;
    }
    /* Ribs inside the tunnel to create depth */
    .tunnel-rib {
      position: absolute;
      border: 4px solid var(--red-dim);
      clip-path: polygon(50% 100%, 0 0, 100% 0);
    }
    .rib-1 { inset: 120px; transform: translateZ(-100px); opacity: 0.8; }
    .rib-2 { inset: 90px; transform: translateZ(-50px); opacity: 0.6; }

    /* Layer 2: Copper Coils & Mechanics */
    .layer-mechanics {
      position: absolute;
      inset: 50px;
      transform: translateZ(-20px);
      border-radius: 50%;
      border: 30px dashed var(--copper-dark); /* Fake coils */
      background: 
        repeating-radial-gradient(circle at center, transparent 0, transparent 40px, var(--metal-dark) 42px, var(--metal-dark) 50px),
        conic-gradient(from 0deg, var(--metal-light), var(--metal-dark), var(--metal-light), var(--metal-dark));
      box-shadow: inset 0 0 50px #000, 0 0 20px #000;
      opacity: 0.9;
    }
    /* Central piston hub */
    .mechanics-hub {
      position: absolute;
      inset: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--metal-light), var(--metal-dark));
      border: 5px solid var(--copper-light);
      box-shadow: 0 10px 20px #000;
      transform: translateZ(10px);
    }

    /* Layer 3: Heavy Metal Outer Chassis */
    .layer-chassis {
      position: absolute;
      inset: 0;
      transform: translateZ(0);
      /* Inverted triangle frame with thick borders */
      background: conic-gradient(from 180deg, var(--metal-dark), var(--metal-light), var(--metal-dark));
      clip-path: polygon(50% 100%, 0 0, 100% 0);
      /* Cut out the center to reveal depths */
      -webkit-mask-image: radial-gradient(circle at center, transparent 200px, black 205px);
      mask-image: radial-gradient(circle at center, transparent 200px, black 205px);
      box-shadow: inset 0 0 20px var(--metal-edge), 0 20px 50px rgba(0,0,0,0.8);
    }

    /* Layer 4 (Top): Cyan Floating Ring & Prongs */
    .layer-cyan-ring {
      position: absolute;
      inset: 100px;
      transform: translateZ(80px); /* distinctly ABOVE the chassis */
      border-radius: 50%;
      border: 8px solid var(--cyan);
      box-shadow: 
        0 0 30px var(--cyan), 
        inset 0 0 20px var(--cyan),
        0 0 80px rgba(0,255,255,0.4); /* Volumetric bloom */
      animation: spin-ring 15s linear infinite;
    }
    /* Outer prongs attached to ring */
    .cyan-prong {
      position: absolute;
      width: 20px;
      height: 60px;
      background: var(--cyan);
      box-shadow: 0 0 20px var(--cyan);
      border-radius: 10px;
    }
    .prong-1 { top: -30px; left: calc(50% - 10px); }
    .prong-2 { bottom: 20px; right: -10px; transform: rotate(-60deg); }
    .prong-3 { bottom: 20px; left: -10px; transform: rotate(60deg); }

    /* Floating particles / sparks */
    .spark {
      position: absolute;
      width: 3px;
      height: 3px;
      background: var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--cyan);
      animation: float-spark 4s infinite linear;
    }

    /* --- ANIMATIONS --- */
    @keyframes gentle-hover {
      0%, 100% { transform: rotateX(30deg) rotateY(15deg) rotateZ(0deg) translateY(0); }
      50% { transform: rotateX(32deg) rotateY(12deg) rotateZ(2deg) translateY(-20px); }
    }
    @keyframes pulse-core {
      0% { opacity: 0.8; box-shadow: 0 0 80px var(--red), inset 0 0 50px #000; transform: translateZ(-150px) scale(0.95); }
      100% { opacity: 1; box-shadow: 0 0 150px var(--red), inset 0 0 20px #000; transform: translateZ(-150px) scale(1.05); }
    }
    @keyframes spin-ring {
      from { transform: translateZ(80px) rotate(0deg); }
      to { transform: translateZ(80px) rotate(360deg); }
    }
    @keyframes haze-drift {
      0% { transform: scale(1) rotate(0deg) translateX(0); }
      50% { transform: scale(1.2) rotate(10deg) translateX(-5%); }
      100% { transform: scale(1) rotate(0deg) translateX(0); }
    }
    @keyframes float-spark {
      0% { transform: translate3d(0, 0, 0) scale(1); opacity: 0;}
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translate3d(100px, -200px, 150px) scale(0); opacity: 0;}
    }

    /* ===== MAIN PORTAL CONTENT (Overlay) ===== */
    .content { position: relative; z-index: 10; padding: 120px 6vw; min-height: 100vh; }
    .glass-panel {
      background: var(--bg-glass);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 60px;
      max-width: 1000px;
      margin: 0 auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    
    .label { font-size:.8rem; font-weight:700; text-transform:uppercase; letter-spacing:.2em; color: var(--cyan); margin-bottom: 20px; }
    h1 { font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 900; line-height: 1.1; margin-bottom: 20px; }
    p { font-size: 1.1rem; color: #aaa; line-height: 1.6; margin-bottom: 40px; max-width: 600px; }
    
    .link-btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 16px 40px;
      border: 2px solid var(--cyan);
      border-radius: 30px;
      color: var(--cyan);
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 1px;
      transition: all 0.3s;
      background: rgba(0, 255, 255, 0.05);
    }
    .link-btn:hover {
      background: rgba(0, 255, 255, 0.2);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
    }

  </style>
</head>
<body>

<!-- 3D SCI-FI ENGINE ROOM BACKGROUND -->
<div class="scene">
  <div class="atmosphere"></div>
  <div class="floor"></div>
  
  <div class="reactor-assembly" id="reactor">
    <!-- Tunnel Ribs (Deepest) -->
    <div class="tunnel-rib rib-1"></div>
    <div class="tunnel-rib rib-2"></div>
    
    <!-- Red Core -->
    <div class="layer-deep-core"></div>
    
    <!-- Mechanics / Coils -->
    <div class="layer-mechanics">
      <div class="mechanics-hub"></div>
    </div>
    
    <!-- Metal Chassis Frame -->
    <div class="layer-chassis"></div>
    
    <!-- High Cyan Ring (Front) -->
    <div class="layer-cyan-ring">
      <div class="cyan-prong prong-1"></div>
      <div class="cyan-prong prong-2"></div>
      <div class="cyan-prong prong-3"></div>
    </div>
  </div>
  
  <div class="atmosphere front"></div>
</div>

<!-- FLOATING PORTAL CONTENT -->
<div class="content">
  <div class="glass-panel">
    <div class="label">SYSTEM ONLINE // JARVIS PROTOCOL</div>
    <h1>MOKSHITH REDDY<br>JARVIS AI CORE</h1>
    <p>
      Personal AI command system. Built to execute intent, orchestrate models, and turn conversation into automated action. This is the central hub.
    </p>
    <a href="https://jarvis-ai-3ba39.web.app" class="link-btn">ENTER THE PORTAL ↗</a>
  </div>
</div>

<script>
  // Add floating sparks in 3D space
  const reactor = document.getElementById('reactor');
  for(let i=0; i<15; i++) {
    let spark = document.createElement('div');
    spark.className = 'spark';
    // Random positions around the core
    spark.style.left = (200 + Math.random() * 200) + 'px';
    spark.style.top = (200 + Math.random() * 200) + 'px';
    spark.style.transform = `translateZ(${Math.random() * 200}px)`;
    spark.style.animationDelay = (Math.random() * 4) + 's';
    reactor.appendChild(spark);
  }
</script>

</body>
</html>
